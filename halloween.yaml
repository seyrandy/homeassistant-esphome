# Board: ESP32-S3 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-s3-devkitc-1/manifest.yaml

esphome:
  name: halloween-kuerbis
  friendly_name: Halloween Kürbis

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret halloween_kuerbis__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: flash_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: flash_step
    type: int
    restore_value: no
    initial_value: "0"

  - id: flash_step_started
    type: uint32_t
    restore_value: no
    initial_value: "0"

light:
  - platform: esp32_rmt_led_strip
    id: pumpkin_ring
    name: "Kürbis LED-Ring"
    pin: GPIO4
    num_leds: 12
    chipset: WS2812
    channel_colors: GRB
    max_refresh_rate: 16ms
    restore_mode: ALWAYS_OFF

    effects:
      - addressable_lambda:
          name: "Rot-Orange-Wimmern"
          update_interval: 20ms
          lambda: |-
            // Zehn weiße Blitze bei Bewegung
            if (id(flash_active)) {
              if (millis() - id(flash_step_started) >= 120) {
                id(flash_step_started) = millis();
                id(flash_step)++;

                if (id(flash_step) >= 20) {
                  id(flash_active) = false;
                }
              }

              if (id(flash_active)) {
                if ((id(flash_step) % 2) == 0) {
                  it.all() = Color(255, 255, 255);
                } else {
                  it.all() = Color::BLACK;
                }
                return;
              }
            }

            // Rot-oranges Wimmern
            static float phase = 0.0f;
            if (initial_run) {
              phase = 0.0f;
            }

            phase += 0.10f;
            if (phase > 6.28318f) {
              phase -= 6.28318f;
            }

            for (int i = 0; i < it.size(); i++) {
              float wave = (sinf(phase + i * 0.55f) + 1.0f) / 2.0f;
              uint8_t red = 100 + (uint8_t)(155 * wave);
              uint8_t green = (uint8_t)(120 * wave);
              it[i] = Color(red, green, 0);
            }


sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
            
binary_sensor:
  - platform: gpio
    name: "Bewegungsmelder"
    device_class: motion
    pin:
      number: GPIO5
      mode:
        input: true
    on_press:
      then:
        - if:
            condition:
              lambda: return !id(flash_active);
            then:
              - lambda: |-
                  id(flash_active) = true;
                  id(flash_step) = 0;
                  id(flash_step_started) = millis();