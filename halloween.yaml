esphome:
  name: halloween-kuerbis
  friendly_name: Halloween Kürbis

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret halloween_kuerbis__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

light:
  - platform: esp32_rmt_led_strip
    id: pumpkin_ring
    name: "Kürbis LED-Ring"
    pin: GPIO4
    num_leds: 12
    chipset: WS2812
    channel_colors: GRB
    max_refresh_rate: 16ms
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    effects: []