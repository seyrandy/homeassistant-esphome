# Board: ESP32-S3 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-s3-devkitc-1/manifest.yaml

esphome:
  name: garage-controller
  friendly_name: Garagentor

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "uT6EXsB2ZGbtHODRSxAkIjgCPOImULvEPFrX84xEGRQ="

ota:
  - platform: esphome
    password: "21Seyr@30homeassistant"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Garage Fallback"
    password: "fallback1234"

captive_portal:

web_server:
  port: 80

# =========================
# RELAIS (Impuls Tor)
# =========================
switch:
  - platform: gpio
    id: relay_garage
    pin: GPIO4
    restore_mode: ALWAYS_OFF

# =========================
# REEDKONTAKT + STATUS
# =========================
binary_sensor:
  - platform: gpio
    id: garage_closed
    name: "Garagentor geschlossen"
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  - platform: status
    name: "Garage ESP Status"

# =========================
# IMPULS BUTTON
# =========================
button:
  - platform: template
    id: garage_trigger
    name: "Garagentor Impuls"
    on_press:
      - switch.turn_on: relay_garage
      - delay: 500ms
      - switch.turn_off: relay_garage

  - platform: restart
    name: "ESP Neustart"

# =========================
# GARAGENTOR (COVER)
# =========================
cover:
  - platform: template
    name: "Garage"
    device_class: garage

    lambda: |-
      if (id(garage_closed).state) {
        return COVER_CLOSED;
      } else {
        return COVER_OPEN;
      }

    open_action:
      - button.press: garage_trigger

    close_action:
      - button.press: garage_trigger

    stop_action:
      - button.press: garage_trigger

# =========================
# DIAGNOSE
# =========================
sensor:
  - platform: wifi_signal
    name: "Garage WLAN Signal"
    update_interval: 60s

  - platform: uptime
    name: "Garage Laufzeit"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Garage IP"