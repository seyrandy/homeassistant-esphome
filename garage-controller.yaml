# Board: ESP32-S3 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-s3-devkitc-1/manifest.yaml

esphome:
  name: garage-controller
  friendly_name: Garagentor

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "uT6EXsB2ZGbtHODRSxAkIjgCPOImULvEPFrX84xEGRQ="

ota:
  - platform: esphome
    password: "21Seyr@30homeassistant"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Garage Fallback"
    password: "2D2BISeE3HVY"

captive_portal:

web_server:
  port: 80

sensor:
  - platform: wifi_signal
    name: "Garage WLAN Signal"
    update_interval: 60s

  - platform: uptime
    name: "Garage Laufzeit"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Garage IP-Adresse"

binary_sensor:
  - platform: status
    name: "ESP Online"

switch:
  - platform: gpio
    id: garage_relay
    name: "Garagentor Relais"
    pin: GPIO4
    restore_mode: ALWAYS_OFF
    internal: true

button:                              # ← nur noch EINMAL vorhanden
  - platform: template
    name: "Garagentor Impuls"
    icon: "mdi:garage"
    on_press:
      - switch.turn_on: garage_relay
      - delay: 500ms
      - switch.turn_off: garage_relay

  - platform: restart
    name: "ESP Neustart"
    icon: "mdi:restart"

