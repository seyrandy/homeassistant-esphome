############################################################
# Garage Suite
# ----------------------------------------------------------
# Datei.........: garage-controller.yaml
# Version.......: 1.4.0
# Home Assistant: Core 2026.6.4
# ESPHome.......: aktuelle Version
#
# Beschreibung:
# Steuerung des Normstahl Magic 600 Garagentors
# über ESP32-S3 und ein Relais.
#
# Hardware:
# - ESP32-S3 DevKitC-1 N16R8
# - 1-Kanal-Relais an GPIO4
# - Reedkontakt "geschlossen" an GPIO5
# - Reedkontakt "geöffnet" an GPIO6
#
# Endlagen:
# - GPIO5 = vollständig geschlossen
# - GPIO6 = vollständig geöffnet
#
# Gemessene Fahrzeiten:
# - Öffnen: ca. 15 Sekunden
# - Schließen: ca. 17 Sekunden
#
# Sicherheits-Timeout:
# - Öffnen: 18 Sekunden
# - Schließen: 20 Sekunden
#
# Cover-Anzeige:
# - 0 %   = geschlossen
# - 100 % = geöffnet
# - Zwischenwerte = aktuelle Fahr-/Zwischenposition
#
# Status:
# - 🔴 Geschlossen
# - 🟢 Offen
# - 🟡 Öffnet
# - 🟡 Schließt
# - 🟡 Zwischenstellung
# - ⚠️ Fehler
#
# Steuerungsprinzip:
#
# Geschlossen
#     │
#     └── Impuls ──> Öffnen
#
# Offen
#     │
#     └── Impuls ──> Schließen
#
# Während der Fahrt
#     │
#     └── STOP ──> Impuls ──> Tor stoppt
#
# Zwischenstellung
#     │
#     └── manueller Impuls ──> Normstahl entscheidet
#                              über den nächsten Schritt
#
# WICHTIG:
# Nach einem STOP wird KEIN automatischer Folgeimpuls erzeugt.
#
# VERSION 1.4.0:
# - laufende Cover-Position während der Fahrt
# - Öffnen: 0 -> 100 %
# - Schließen: 100 -> 0 %
# - STOP friert aktuelle Position ein
# - Reedkontakte setzen Endpositionen exakt
# - current_operation wird separat veröffentlicht
# - keine Kombination von position und current_operation
#   in einem cover.template.publish
#
# Autor........: ChatGPT & Andreas
# Erstellt.....: 2026
############################################################


esphome:
  name: garage
  friendly_name: Garagentor


esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf


logger:


api:
  encryption:
    key: !secret garage__encryption_key


ota:
  - platform: esphome
    encryption:


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: !secret garage__ap_ssid
    password: !secret garage__ap_password


captive_portal:


web_server:
  port: 80


############################################################
# RELAIS
############################################################

switch:
  - platform: gpio
    id: relay_garage
    pin:
      number: GPIO4
      inverted: false
    restore_mode: ALWAYS_OFF
    internal: true


############################################################
# GLOBALE VARIABLEN
############################################################

globals:

  # true = Tor befindet sich laut Steuerung in einer Fahrt
  - id: garage_moving
    type: bool
    restore_value: no
    initial_value: 'false'

  # 0 = keine Bewegung
  # 1 = Öffnen
  # 2 = Schließen
  - id: garage_direction
    type: int
    restore_value: no
    initial_value: '0'

  # Aktuelle geschätzte Torposition
  # 0.0 = geschlossen
  # 1.0 = geöffnet
  - id: garage_position
    type: float
    restore_value: no
    initial_value: '0.0'

  # Zeitpunkt des Beginns der aktuellen Fahrt
  - id: garage_motion_start
    type: uint32_t
    restore_value: no
    initial_value: '0'

############################################################
# REEDKONTAKTE
############################################################

binary_sensor:

  ##########################################################
  # REEDKONTAKT GESCHLOSSEN – GPIO5
  ##########################################################

  - platform: gpio
    id: garage_closed
    name: "Garagentor geschlossen"

    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

    on_press:
      then:

        # GPIO5 ist nur beim SCHLIESSEN die relevante Endlage.
        # Während des Öffnens wird ein Signal ignoriert.
        - if:
            condition:
              lambda: |-
                return id(garage_moving) &&
                       id(garage_direction) == 2;

            then:

              - logger.log:
                  level: INFO
                  format: "Endlage GESCHLOSSEN erreicht"

              - lambda: |-
                  id(garage_moving) = false;
                  id(garage_direction) = 0;
                  id(garage_position) = 0.0f;

              - script.stop: garage_movement_watch

              - cover.template.publish:
                  id: garage_cover
                  position: 0.0

              - cover.template.publish:
                  id: garage_cover
                  current_operation: IDLE


  ##########################################################
  # REEDKONTAKT GEÖFFNET – GPIO6
  ##########################################################

  - platform: gpio
    id: garage_open
    name: "Garagentor geöffnet"

    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

    on_press:
      then:

        # GPIO6 ist nur beim ÖFFNEN die relevante Endlage.
        # Während des Schließens wird ein Signal ignoriert.
        - if:
            condition:
              lambda: |-
                return id(garage_moving) &&
                       id(garage_direction) == 1;

            then:

              - logger.log:
                  level: INFO
                  format: "Endlage GEÖFFNET erreicht"

              - lambda: |-
                  id(garage_moving) = false;
                  id(garage_direction) = 0;
                  id(garage_position) = 1.0f;

              - script.stop: garage_movement_watch

              - cover.template.publish:
                  id: garage_cover
                  position: 1.0

              - cover.template.publish:
                  id: garage_cover
                  current_operation: IDLE


  ##########################################################
  # ESP ONLINE
  ##########################################################

  - platform: status
    name: "ESP Online"
    entity_category: diagnostic


############################################################
# IMPULS- UND FAHRTSCRIPTE
############################################################

script:

  ##########################################################
  # RELAISIMPULS
  ##########################################################

  - id: garage_pulse
    mode: single

    then:

      - switch.turn_on: relay_garage

      - delay: 500ms

      - switch.turn_off: relay_garage


  ##########################################################
  # SICHERHEITSÜBERWACHUNG
  ##########################################################

  - id: garage_movement_watch
    mode: restart

    then:

      ######################################################
      # ÖFFNEN
      ######################################################

      - if:
          condition:
            lambda: |-
              return id(garage_direction) == 1;

          then:

            - delay: 18s

            - if:
                condition:
                  lambda: |-
                    return id(garage_moving);

                then:

                  - logger.log:
                      level: WARN
                      format: "Sicherheits-Timeout beim Öffnen des Garagentors"

                  - lambda: |-
                      id(garage_moving) = false;
                      id(garage_direction) = 0;

                  - cover.template.publish:
                      id: garage_cover
                      current_operation: IDLE


      ######################################################
      # SCHLIESSEN
      ######################################################

      - if:
          condition:
            lambda: |-
              return id(garage_direction) == 2;

          then:

            - delay: 20s

            - if:
                condition:
                  lambda: |-
                    return id(garage_moving);

                then:

                  - logger.log:
                      level: WARN
                      format: "Sicherheits-Timeout beim Schließen des Garagentors"

                  - lambda: |-
                      id(garage_moving) = false;
                      id(garage_direction) = 0;

                  - cover.template.publish:
                      id: garage_cover
                      current_operation: IDLE


  ##########################################################
  # ÖFFNEN
  ##########################################################

  - id: garage_open_action
    mode: single

    then:

      # Wenn das Tor bereits fährt, keinen zweiten Impuls senden
      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            - logger.log:
                level: INFO
                format: "Öffnen ignoriert - Garagentor fährt bereits"


      # Nur wenn das Tor nicht fährt
      - if:
          condition:
            lambda: |-
              return !id(garage_moving);

          then:

            ################################################
            # AUS GESCHLOSSENER POSITION ÖFFNEN
            ################################################

            - if:
                condition:
                  lambda: |-
                    return id(garage_closed).state;

                then:

                  - lambda: |-
                      id(garage_moving) = true;
                      id(garage_direction) = 1;
                      id(garage_position) = 0.0f;
                      id(garage_motion_start) = millis();

                  - cover.template.publish:
                      id: garage_cover
                      position: 0.0

                  - cover.template.publish:
                      id: garage_cover
                      current_operation: OPENING

                  - script.execute: garage_pulse

                  - script.execute: garage_movement_watch


            ################################################
            # AUS ZWISCHENSTELLUNG
            ################################################

            - if:
                condition:
                  lambda: |-
                    return !id(garage_closed).state &&
                           !id(garage_open).state;

                then:

                  - logger.log:
                      level: INFO
                      format: "Manueller Impuls aus Zwischenstellung"

                  # Wichtig:
                  # Keine Richtungsannahme.
                  # Der Normstahl entscheidet.
                  - script.execute: garage_pulse


  ##########################################################
  # SCHLIESSEN
  ##########################################################

  - id: garage_close_action
    mode: single

    then:

      # Wenn das Tor bereits fährt, keinen zweiten Impuls senden
      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            - logger.log:
                level: INFO
                format: "Schließen ignoriert - Garagentor fährt bereits"


      # Nur wenn das Tor nicht fährt
      - if:
          condition:
            lambda: |-
              return !id(garage_moving);

          then:

            ################################################
            # AUS GEÖFFNETER POSITION SCHLIESSEN
            ################################################

            - if:
                condition:
                  lambda: |-
                    return id(garage_open).state;

                then:

                  - lambda: |-
                      id(garage_moving) = true;
                      id(garage_direction) = 2;
                      id(garage_position) = 1.0f;
                      id(garage_motion_start) = millis();

                  - cover.template.publish:
                      id: garage_cover
                      position: 1.0

                  - cover.template.publish:
                      id: garage_cover
                      current_operation: CLOSING

                  - script.execute: garage_pulse

                  - script.execute: garage_movement_watch


            ################################################
            # AUS ZWISCHENSTELLUNG
            ################################################

            - if:
                condition:
                  lambda: |-
                    return !id(garage_closed).state &&
                           !id(garage_open).state;

                then:

                  - logger.log:
                      level: INFO
                      format: "Manueller Impuls aus Zwischenstellung"

                  # Keine Richtungsannahme.
                  # Nur einen Impuls an den Normstahl.
                  - script.execute: garage_pulse


  ##########################################################
  # STOP
  ##########################################################

  - id: garage_stop_action
    mode: single

    then:

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            # Zuerst die aktuelle Position berechnen
            - lambda: |-
                const uint32_t elapsed = millis() - id(garage_motion_start);

                if (id(garage_direction) == 1) {
                  float progress = elapsed / 15000.0f;

                  if (progress > 1.0f) {
                    progress = 1.0f;
                  }

                  id(garage_position) = progress;
                }

                if (id(garage_direction) == 2) {
                  float progress = elapsed / 17000.0f;

                  if (progress > 1.0f) {
                    progress = 1.0f;
                  }

                  id(garage_position) = 1.0f - progress;
                }

            # Sicherheitsüberwachung stoppen
            - script.stop: garage_movement_watch

            # Einen einzigen Impuls an den Normstahl
            - script.execute: garage_pulse

            # Bewegung intern beenden
            - lambda: |-
                id(garage_moving) = false;
                id(garage_direction) = 0;

            # Aktuelle Position an Home Assistant melden
            - cover.template.publish:
                id: garage_cover
                position: !lambda |-
                  return id(garage_position);

            # Cover auf IDLE
            - cover.template.publish:
                id: garage_cover
                current_operation: IDLE

            - logger.log:
                level: INFO
                format: "Garagentor manuell gestoppt"


############################################################
# COVER
############################################################

############################################################
# COVER
############################################################

cover:

  - platform: template
    id: garage_cover
    name: "Tor"
    device_class: garage
    has_position: true

    lambda: |-
      return id(garage_position);

    open_action:
      - script.execute: garage_open_action

    close_action:
      - script.execute: garage_close_action

    stop_action:
      - script.execute: garage_stop_action


############################################################
# LAUFENDE POSITIONSBERECHNUNG
############################################################

############################################################
# TEST – POSITIONSBERECHNUNG
############################################################

interval:

  - interval: 1s

    then:

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            - lambda: |-
                const uint32_t elapsed =
                  millis() - id(garage_motion_start);

                float new_position;

                // Öffnen: 15 Sekunden von 0 % auf 100 %
                if (id(garage_direction) == 1) {

                  new_position =
                    elapsed / 15000.0f;

                  if (new_position > 1.0f) {
                    new_position = 1.0f;
                  }

                }

                // Schließen: 17 Sekunden von 100 % auf 0 %
                else if (id(garage_direction) == 2) {

                  new_position =
                    1.0f - (elapsed / 17000.0f);

                  if (new_position < 0.0f) {
                    new_position = 0.0f;
                  }

                }

                else {
                  new_position = id(garage_position);
                }

                id(garage_position) = new_position;

            - logger.log:
                level: INFO
                format: "GARAGE TEST: Position %.0f %% | Richtung %d"
                args:
                  - "id(garage_position) * 100.0f"
                  - "id(garage_direction)"

############################################################
# STATUS-TEXT
############################################################

text_sensor:

  ##########################################################
  # TORSTATUS
  ##########################################################

  - platform: template

    name: "Torstatus"

    icon: mdi:garage

    lambda: |-
      // Beide Reedkontakte gleichzeitig aktiv:
      // physikalisch unplausibler Zustand.

      if (id(garage_closed).state &&
          id(garage_open).state) {

        return {"⚠️ Fehler"};
      }


      // Während der Fahrt
      if (id(garage_moving)) {

        if (id(garage_direction) == 1) {
          return {"🟡 öffnet..."};
        }

        if (id(garage_direction) == 2) {
          return {"🟡 schließt..."};
        }

        return {"🟡 Bewegung"};
      }


      // Tor vollständig geschlossen
      if (id(garage_closed).state) {
        return {"🔴 Geschlossen"};
      }


      // Tor vollständig geöffnet
      if (id(garage_open).state) {
        return {"🟢 Offen"};
      }


      // Keiner der Reedkontakte aktiv:
      // Fahrt beendet oder Zwischenstellung.

      return {"🟡 Zwischenstellung"};

    update_interval: 200ms


  ##########################################################
  # WLAN-INFORMATIONEN
  ##########################################################

  - platform: wifi_info

    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic

    ssid:
      name: "WLAN"
      entity_category: diagnostic


############################################################
# SENSOR
############################################################

sensor:

  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 60s


  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic


############################################################
# ESP-NEUSTART
############################################################

button:

  - platform: restart
    name: "ESP Neustart"
    entity_category: diagnostic