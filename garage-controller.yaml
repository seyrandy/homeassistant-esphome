# Board: ESP32-S3 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-s3-devkitc-1/manifest.yaml

esphome:
  name: garage
  friendly_name: Garagentor

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret garage__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: !secret garage__ap_ssid
    password: !secret garage__ap_password
captive_portal:

web_server:
  port: 80

# =====================================================
# RELAIS (Impuls zum Tor)
# =====================================================
switch:
  - platform: gpio
    id: relay_garage
    pin:
      number: GPIO4
      inverted: false
    restore_mode: ALWAYS_OFF
    internal: true


binary_sensor:
  # ===================================================
  # REEDKONTAKT 1 – Tor geschlossen
  # GPIO5
  # ===================================================
  - platform: gpio
    id: garage_closed
    name: "Garagentor geschlossen"

    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

        
  # ===================================================
  # REEDKONTAKT 2 – Tor geöffnet
  # GPIO6
  # ===================================================
  - platform: gpio
    id: garage_open
    name: "Garagentor geöffnet"

    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  # ===================================================
  # ESP ONLINE
  # ===================================================
  - platform: status
    name: "ESP Online"
    entity_category: diagnostic

    
# =====================================================
# SPERRLOGIK (Schutz vor Mehrfach-Impuls)
# =====================================================
globals:
  - id: garage_lock
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: garage_pulse
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(garage_lock) == false;'
          then:
            - lambda: 'id(garage_lock) = true;'

            - switch.turn_on: relay_garage
            - delay: 500ms
            - switch.turn_off: relay_garage

            # Sperrzeit = typische Laufzeit + Sicherheitsreserve
            - delay: 18s

            - lambda: 'id(garage_lock) = false;'

# =====================================================
# GARAGENTOR (COVER)
# =====================================================
cover:
  - platform: template
    name: "Tor"
    device_class: garage

    lambda: |-
      if (id(garage_closed).state) {
        return COVER_CLOSED;
      } else {
        return COVER_OPEN;
      }

    open_action:
      - script.execute: garage_pulse

    close_action:
      - script.execute: garage_pulse

    stop_action:
      - script.execute: garage_pulse

# =====================================================
# DIAGNOSE
# =====================================================
sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic

    ssid:
      name: "WLAN"
      entity_category: diagnostic

  - platform: template
    name: "Torstatus"
    icon: mdi:garage

    lambda: |-
      if (id(garage_closed).state) {
        return {"🟢 Geschlossen"};
      } else {
        return {"🟠 Offen"};
      }

    update_interval: 1s

# =====================================================
# NEUSTART
# =====================================================
button:
  - platform: restart
    name: "ESP Neustart"
    entity_category: diagnostic