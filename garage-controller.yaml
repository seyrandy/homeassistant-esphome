############################################################
# Garage Suite
# ----------------------------------------------------------
# Datei.........: garage_controller.yaml
# Version.......: 1.3.1
# Home Assistant: Core 2026.6.4
# ESPHome.......: aktuelle Version
#
# Beschreibung:
# Steuerung des Normstahl Garagentors über einen ESP32-S3.
#
# Hardware:
# - ESP32-S3 DevKitC-1 N16R8
# - 1-Kanal-Relais an GPIO4
# - Reedkontakt "geschlossen" an GPIO5
# - Reedkontakt "geöffnet" an GPIO6
#
# Endlagen:
# - GPIO5 = vollständig geschlossen
# - GPIO6 = vollständig geöffnet
#
# Gemessene Fahrzeiten:
# - Öffnen: ca. 15 Sekunden
# - Schließen: ca. 17 Sekunden
#
# Sicherheits-Timeout:
# - Öffnen: 18 Sekunden
# - Schließen: 20 Sekunden
#
# Status:
# - 🔴 Geschlossen
# - 🟢 Offen
# - 🟡 Öffnet
# - 🟡 Schließt
# - 🟡 Zwischenstellung
# - ⚠️ Fehler
#
# Steuerungsprinzip:
#
# Geschlossen
#     │
#     └── Impuls ──> Öffnen
#
# Offen
#     │
#     └── Impuls ──> Schließen
#
# Während der Fahrt
#     │
#     └── STOP ──> Impuls ──> Tor stoppt
#
# Zwischenstellung
#     │
#     └── manueller Impuls ──> Normstahl entscheidet
#                              über den nächsten Schritt
#
# WICHTIG:
# Nach einem STOP wird KEIN automatischer Folgeimpuls
# erzeugt.
#
# VERSION 1.3.1:
# - Cover erhält OPENING beim Öffnen
# - Cover erhält CLOSING beim Schließen
# - Cover erhält IDLE beim Stoppen
# - Keine gleichzeitige Verwendung von position und
#   current_operation in cover.template.publish
#
# Autor........: ChatGPT & Andreas
# Erstellt.....: 2026
############################################################


# ==========================================================
# ESP32
# ==========================================================

esphome:
  name: garage
  friendly_name: Garagentor

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB

  framework:
    type: esp-idf


# ==========================================================
# SYSTEM
# ==========================================================

logger:

api:
  encryption:
    key: !secret garage__encryption_key

ota:
  - platform: esphome
    password: !secret garage__ota_password


# ==========================================================
# WLAN
# ==========================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: !secret garage__ap_ssid
    password: !secret garage__ap_password

captive_portal:


# ==========================================================
# WEBINTERFACE
# ==========================================================

web_server:
  port: 80


# ==========================================================
# RELAIS
# ----------------------------------------------------------
# GPIO4 erzeugt den Impuls für den Normstahl.
# ==========================================================

switch:
  - platform: gpio
    id: relay_garage

    pin:
      number: GPIO4
      inverted: false

    restore_mode: ALWAYS_OFF

    # Relais nicht als normalen Schalter anzeigen
    internal: true


# ==========================================================
# GLOBALE VARIABLEN
# ==========================================================

globals:

  # --------------------------------------------------------
  # Ist das Tor momentan in einer überwachten Fahrt?
  #
  # false = keine überwachte Fahrt
  # true  = Öffnen oder Schließen
  # --------------------------------------------------------

  - id: garage_moving
    type: bool
    restore_value: no
    initial_value: 'false'


  # --------------------------------------------------------
  # Bewegungsrichtung
  #
  # 0 = keine Bewegung
  # 1 = Öffnen
  # 2 = Schließen
  # --------------------------------------------------------

  - id: garage_direction
    type: int
    restore_value: no
    initial_value: '0'


# ==========================================================
# REEDKONTAKTE
# ==========================================================

binary_sensor:

  # ========================================================
  # GPIO5
  # TOR VOLLSTÄNDIG GESCHLOSSEN
  # ========================================================

  - platform: gpio
    id: garage_closed
    name: "Garagentor geschlossen"

    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

    on_press:
      then:

        # Fahrt beenden
        - lambda: |-
            id(garage_moving) = false;
            id(garage_direction) = 0;

        # Sicherheits-Timeout abbrechen
        - script.stop: garage_movement_watch

        # Cover auf Stillstand setzen
        - cover.template.publish:
            id: garage_cover
            state: CLOSED


  # ========================================================
  # GPIO6
  # TOR VOLLSTÄNDIG GEÖFFNET
  # ========================================================

  - platform: gpio
    id: garage_open
    name: "Garagentor geöffnet"

    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

    on_press:
      then:

        # Fahrt beenden
        - lambda: |-
            id(garage_moving) = false;
            id(garage_direction) = 0;

        # Sicherheits-Timeout abbrechen
        - script.stop: garage_movement_watch

        # Cover auf geöffnet setzen
        - cover.template.publish:
            id: garage_cover
            state: OPEN


  # ========================================================
  # ESP ONLINE
  # ========================================================

  - platform: status
    name: "ESP Online"
    entity_category: diagnostic


# ==========================================================
# SCRIPTS
# ==========================================================

script:

  # ========================================================
  # RELAISIMPULS
  # ========================================================
  #
  # 500-ms-Impuls an den Normstahl.
  # ========================================================

  - id: garage_pulse
    mode: single

    then:

      - switch.turn_on: relay_garage

      - delay: 500ms

      - switch.turn_off: relay_garage


  # ========================================================
  # SICHERHEITS-ÜBERWACHUNG
  # ========================================================
  #
  # Öffnen  = maximal 18 Sekunden
  # Schließen = maximal 20 Sekunden
  #
  # Wird vorher ein Reedkontakt erreicht, wird dieses
  # Script durch script.stop beendet.
  # ========================================================

  - id: garage_movement_watch
    mode: restart

    then:

      # ----------------------------------------------------
      # ÖFFNEN
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_direction) == 1;

          then:

            - delay: 18s

            - if:
                condition:
                  lambda: |-
                    return id(garage_moving);

                then:

                  - logger.log:
                      level: WARN
                      format: "Sicherheits-Timeout beim Öffnen des Garagentors"

                  - lambda: |-
                      id(garage_moving) = false;
                      id(garage_direction) = 0;

                  # Nur Betriebszustand setzen.
                  # Position kommt weiterhin aus der Lambda.
                  - cover.template.publish:
                      id: garage_cover
                      current_operation: IDLE


      # ----------------------------------------------------
      # SCHLIESSEN
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_direction) == 2;

          then:

            - delay: 20s

            - if:
                condition:
                  lambda: |-
                    return id(garage_moving);

                then:

                  - logger.log:
                      level: WARN
                      format: "Sicherheits-Timeout beim Schließen des Garagentors"

                  - lambda: |-
                      id(garage_moving) = false;
                      id(garage_direction) = 0;

                  # Nur Betriebszustand setzen.
                  - cover.template.publish:
                      id: garage_cover
                      current_operation: IDLE


  # ========================================================
  # ÖFFNEN
  # ========================================================

  - id: garage_open_action
    mode: single

    then:

      # ----------------------------------------------------
      # Wenn das Tor bereits fährt:
      # keinen weiteren Öffnungsbefehl ausführen.
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            - logger.log:
                level: INFO
                format: "Öffnen ignoriert - Garagentor fährt bereits"


      # ----------------------------------------------------
      # Keine überwachte Fahrt
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return !id(garage_moving);

          then:

            # ------------------------------------------------
            # TOR GESCHLOSSEN
            #
            # Impuls = Öffnen
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return id(garage_closed).state;

                then:

                  # Bewegungsstatus setzen
                  - lambda: |-
                      id(garage_moving) = true;
                      id(garage_direction) = 1;

                  # Cover informiert Home Assistant:
                  # Das Tor wird geöffnet.
                  #
                  # KEIN position: hier!
                  - cover.template.publish:
                      id: garage_cover
                      current_operation: OPENING

                  # Impuls an Normstahl
                  - script.execute: garage_pulse

                  # Sicherheitsüberwachung starten
                  - script.execute: garage_movement_watch


            # ------------------------------------------------
            # ZWISCHENSTELLUNG
            #
            # Keine Richtung annehmen.
            # Einfach einen Impuls an den Normstahl senden.
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return !id(garage_closed).state &&
                           !id(garage_open).state;

                then:

                  - logger.log:
                      level: INFO
                      format: "Manueller Impuls aus Zwischenstellung"

                  - script.execute: garage_pulse


  # ========================================================
  # SCHLIESSEN
  # ========================================================

  - id: garage_close_action
    mode: single

    then:

      # ----------------------------------------------------
      # Wenn das Tor bereits fährt:
      # keinen weiteren Schließbefehl ausführen.
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            - logger.log:
                level: INFO
                format: "Schließen ignoriert - Garagentor fährt bereits"


      # ----------------------------------------------------
      # Keine überwachte Fahrt
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return !id(garage_moving);

          then:

            # ------------------------------------------------
            # TOR GEÖFFNET
            #
            # Impuls = Schließen
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return id(garage_open).state;

                then:

                  # Bewegungsstatus setzen
                  - lambda: |-
                      id(garage_moving) = true;
                      id(garage_direction) = 2;

                  # Cover informieren:
                  # Das Tor wird geschlossen.
                  - cover.template.publish:
                      id: garage_cover
                      current_operation: CLOSING

                  # Impuls an Normstahl
                  - script.execute: garage_pulse

                  # Sicherheitsüberwachung starten
                  - script.execute: garage_movement_watch


            # ------------------------------------------------
            # ZWISCHENSTELLUNG
            #
            # Keine Richtung annehmen.
            # Einfach einen Impuls an den Normstahl senden.
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return !id(garage_closed).state &&
                           !id(garage_open).state;

                then:

                  - logger.log:
                      level: INFO
                      format: "Manueller Impuls aus Zwischenstellung"

                  - script.execute: garage_pulse


  # ========================================================
  # STOP
  # ========================================================
  #
  # STOP:
  # - Sicherheitsüberwachung beenden
  # - einen Impuls senden
  # - interne Bewegung beenden
  # - KEIN automatischer Folgeimpuls
  # ========================================================

  - id: garage_stop_action
    mode: single

    then:

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            # Sicherheitsüberwachung abbrechen
            - script.stop: garage_movement_watch

            # Ein Impuls stoppt das Normstahl-Tor
            - script.execute: garage_pulse

            # Interne Bewegung beenden
            - lambda: |-
                id(garage_moving) = false;
                id(garage_direction) = 0;

            # Cover auf Stillstand setzen
            - cover.template.publish:
                id: garage_cover
                current_operation: IDLE

            - logger.log:
                level: INFO
                format: "Garagentor manuell gestoppt"


# ==========================================================
# COVER
# ==========================================================

cover:

  - platform: template

    id: garage_cover

    name: "Tor"

    device_class: garage

    has_position: true
    assumed_state: true


    # ------------------------------------------------------
    # POSITION
    #
    # 0.0 = geschlossen
    # 1.0 = geöffnet
    # 0.5 = Zwischenstellung
    #
    # Während der Fahrt befinden sich beide Reedkontakte
    # auf OFF.
    #
    # Die Position ist dann 0.5.
    #
    # Die Anzeige "Öffnet" / "Schließt" kommt zusätzlich
    # über current_operation.
    # ------------------------------------------------------

    lambda: |-

      # Beide Reedkontakte gleichzeitig aktiv:
      # physikalisch unplausibler Zustand.
      if (id(garage_closed).state &&
          id(garage_open).state) {
        return 0.5f;
      }

      # Tor vollständig geschlossen
      if (id(garage_closed).state) {
        return 0.0f;
      }

      # Tor vollständig geöffnet
      if (id(garage_open).state) {
        return 1.0f;
      }

      # Keiner der Reedkontakte aktiv:
      # Fahrt oder Zwischenstellung.
      return 0.5f;


    # ------------------------------------------------------
    # ÖFFNEN
    # ------------------------------------------------------

    open_action:
      - script.execute: garage_open_action


    # ------------------------------------------------------
    # SCHLIESSEN
    # ------------------------------------------------------

    close_action:
      - script.execute: garage_close_action


    # ------------------------------------------------------
    # STOP
    # ------------------------------------------------------

    stop_action:
      - script.execute: garage_stop_action


# ==========================================================
# STATUS-TEXT
# ==========================================================

text_sensor:

  - platform: template

    name: "Torstatus"

    icon: mdi:garage

    lambda: |-

      # ----------------------------------------------------
      # FEHLER
      # ----------------------------------------------------

      if (id(garage_closed).state &&
          id(garage_open).state) {
        return {"⚠️ Fehler"};
      }


      # ----------------------------------------------------
      # ÖFFNEN / SCHLIESSEN
      # ----------------------------------------------------

      if (id(garage_moving)) {

        if (id(garage_direction) == 1) {
          return {"🟡 Öffnet"};
        }

        if (id(garage_direction) == 2) {
          return {"🟡 Schließt"};
        }

        return {"🟡 Bewegung"};
      }


      # ----------------------------------------------------
      # GESCHLOSSEN
      # ----------------------------------------------------

      if (id(garage_closed).state) {
        return {"🔴 Geschlossen"};
      }


      # ----------------------------------------------------
      # GEÖFFNET
      # ----------------------------------------------------

      if (id(garage_open).state) {
        return {"🟢 Offen"};
      }


      # ----------------------------------------------------
      # ZWISCHENSTELLUNG
      # ----------------------------------------------------

      return {"🟡 Zwischenstellung"};

    update_interval: 200ms


  # ========================================================
  # WLAN-INFORMATIONEN
  # ========================================================

  - platform: wifi_info

    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic

    ssid:
      name: "WLAN"
      entity_category: diagnostic


# ==========================================================
# DIAGNOSE-SENSOREN
# ==========================================================

sensor:

  # --------------------------------------------------------
  # WLAN-SIGNAL
  # --------------------------------------------------------

  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 60s


  # --------------------------------------------------------
  # LAUFZEIT
  # --------------------------------------------------------

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic


# ==========================================================
# ESP-NEUSTART
# ==========================================================

button:

  - platform: restart
    name: "ESP Neustart"
    entity_category: diagnostic