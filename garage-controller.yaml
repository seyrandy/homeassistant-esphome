############################################################
# Garage Suite
# ----------------------------------------------------------
# Datei.........: garage_controller.yaml
# Version.......: 1.2.0
# Home Assistant: Core 2026.6.4
# ESPHome.......: aktuelle Version
#
# Beschreibung:
# Steuerung des Normstahl Garagentors über einen ESP32-S3.
#
# Das Garagentor wird über einen kurzen Relaisimpuls
# gesteuert.
#
# Hardware:
# - ESP32-S3 DevKitC-1 N16R8
# - 1-Kanal-Relais an GPIO4
# - Reedkontakt "geschlossen" an GPIO5
# - Reedkontakt "geöffnet" an GPIO6
#
# Endlagen:
# - GPIO5 = vollständig geschlossen
# - GPIO6 = vollständig geöffnet
#
# Gemessene Fahrzeiten:
# - Öffnen: ca. 15 Sekunden
# - Schließen: ca. 17 Sekunden
#
# Sicherheits-Timeout:
# - Öffnen: 18 Sekunden
# - Schließen: 20 Sekunden
#
# Statusanzeige:
# - 🔴 Geschlossen
# - 🟢 Offen
# - 🟡 Öffnet
# - 🟡 Schließt
# - 🟡 Zwischenstellung
# - ⚠️ Fehler
#
# Steuerungsprinzip:
#
# Geschlossen
#     │
#     └── Impuls ──> Öffnen
#
# Offen
#     │
#     └── Impuls ──> Schließen
#
# Während der Fahrt
#     │
#     └── STOP ──> Impuls ──> Tor stoppt
#
# Zwischenstellung
#     │
#     └── manueller Impuls ──> Normstahl entscheidet
#                              über den nächsten Schritt
#
# WICHTIG:
# Nach einem STOP wird KEIN automatischer Folgeimpuls
# erzeugt.
#
# Autor........: ChatGPT & Andreas
# Erstellt.....: 2026
############################################################


# ==========================================================
# ESPHOME / BOARD
# ==========================================================

esphome:
  name: garage
  friendly_name: Garagentor

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf


# ==========================================================
# GRUNDEINSTELLUNGEN
# ==========================================================

logger:

api:
  encryption:
    key: !secret garage__encryption_key

ota:
  - platform: esphome
    password: !secret garage__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: !secret garage__ap_ssid
    password: !secret garage__ap_password

captive_portal:


# ==========================================================
# WEB-SERVER
#
# Ermöglicht den direkten Zugriff auf die ESPHome-Webseite.
# ==========================================================

web_server:
  port: 80


# ==========================================================
# RELAIS
# ==========================================================
#
# GPIO4 steuert das Relais.
#
# Das Relais wird für 500 ms eingeschaltet.
# Dadurch erhält der Normstahl-Antrieb einen einzelnen
# Steuerimpuls.
#
# Das Relais ist intern und erscheint nicht als Schalter
# in Home Assistant.
# ==========================================================

switch:

  - platform: gpio
    id: relay_garage

    pin:
      number: GPIO4
      inverted: false

    restore_mode: ALWAYS_OFF
    internal: true


# ==========================================================
# GLOBALE ZUSTÄNDE
# ==========================================================

globals:

  # --------------------------------------------------------
  # garage_moving
  #
  # TRUE:
  # Das Tor befindet sich laut Software gerade in einer
  # aktiven Fahrt.
  #
  # FALSE:
  # Keine aktive Fahrt.
  # --------------------------------------------------------

  - id: garage_moving
    type: bool
    restore_value: no
    initial_value: 'false'


  # --------------------------------------------------------
  # garage_direction
  #
  # 0 = keine Fahrtrichtung
  # 1 = Öffnen
  # 2 = Schließen
  # --------------------------------------------------------

  - id: garage_direction
    type: int
    restore_value: no
    initial_value: '0'


# ==========================================================
# REEDKONTAKTE
# ==========================================================

binary_sensor:

  # ========================================================
  # GPIO5
  # VOLLSTÄNDIG GESCHLOSSEN
  # ========================================================

  - platform: gpio
    id: garage_closed
    name: "Garagentor geschlossen"

    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms


    # ------------------------------------------------------
    # Wenn die geschlossene Endlage erreicht wird:
    #
    # - Fahrt beenden
    # - Richtung zurücksetzen
    # - Bewegungsüberwachung stoppen
    # ------------------------------------------------------

    on_press:
      then:

        - lambda: |-
            id(garage_moving) = false;
            id(garage_direction) = 0;

        - script.stop: garage_movement_watch


  # ========================================================
  # GPIO6
  # VOLLSTÄNDIG GEÖFFNET
  # ========================================================

  - platform: gpio
    id: garage_open
    name: "Garagentor geöffnet"

    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true

    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms


    # ------------------------------------------------------
    # Wenn die geöffnete Endlage erreicht wird:
    #
    # - Fahrt beenden
    # - Richtung zurücksetzen
    # - Bewegungsüberwachung stoppen
    # ------------------------------------------------------

    on_press:
      then:

        - lambda: |-
            id(garage_moving) = false;
            id(garage_direction) = 0;

        - script.stop: garage_movement_watch


  # ========================================================
  # ESP ONLINE
  # ========================================================

  - platform: status
    name: "ESP Online"
    entity_category: diagnostic


# ==========================================================
# SCRIPTS
# ==========================================================

script:

  # ========================================================
  # 1. RELAISIMPULS
  # ========================================================
  #
  # Erzeugt genau einen 500-ms-Impuls.
  #
  # Dieser Impuls wird niemals selbstständig wiederholt.
  # ========================================================

  - id: garage_pulse
    mode: single

    then:

      - switch.turn_on: relay_garage

      - delay: 500ms

      - switch.turn_off: relay_garage


  # ========================================================
  # 2. BEWEGUNGSÜBERWACHUNG
  # ========================================================
  #
  # Dieses Script erzeugt KEINEN Impuls.
  #
  # Es überwacht lediglich die maximale Fahrzeit.
  #
  # Öffnen:
  # maximal 18 Sekunden
  #
  # Schließen:
  # maximal 20 Sekunden
  #
  # Wird vorher der entsprechende Reedkontakt erreicht,
  # wird dieses Script durch den Reedkontakt beendet.
  #
  # Wichtig:
  # Ein Timeout erzeugt KEINEN weiteren Relaisimpuls.
  # ========================================================

  - id: garage_movement_watch
    mode: restart

    then:

      # ----------------------------------------------------
      # ÖFFNEN
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_direction) == 1;

          then:

            - delay: 18s

            - if:
                condition:
                  lambda: |-
                    return id(garage_moving);

                then:

                  - logger.log:
                      level: WARN
                      format: "Sicherheits-Timeout beim Öffnen des Garagentors"

                  - lambda: |-
                      id(garage_moving) = false;
                      id(garage_direction) = 0;


      # ----------------------------------------------------
      # SCHLIESSEN
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_direction) == 2;

          then:

            - delay: 20s

            - if:
                condition:
                  lambda: |-
                    return id(garage_moving);

                then:

                  - logger.log:
                      level: WARN
                      format: "Sicherheits-Timeout beim Schließen des Garagentors"

                  - lambda: |-
                      id(garage_moving) = false;
                      id(garage_direction) = 0;


  # ========================================================
  # 3. ÖFFNEN
  # ========================================================
  #
  # Fall A:
  # Tor ist vollständig geschlossen
  # -> Impuls
  # -> Tor beginnt zu öffnen
  #
  # Fall B:
  # Tor steht in Zwischenstellung
  # -> manueller Impuls
  # -> Normstahl entscheidet selbst über den nächsten Schritt
  #
  # Fall C:
  # Tor fährt bereits
  # -> KEIN weiterer Impuls
  # ========================================================

  - id: garage_open_action
    mode: single

    then:

      # ----------------------------------------------------
      # Während einer aktiven Fahrt nichts tun.
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            - logger.log:
                level: INFO
                format: "Öffnen ignoriert - Garagentor fährt bereits"


      # ----------------------------------------------------
      # Wenn keine Fahrt aktiv ist:
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return !id(garage_moving);

          then:

            # ------------------------------------------------
            # VOLLSTÄNDIG GESCHLOSSEN
            #
            # -> Öffnung starten
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return id(garage_closed).state;

                then:

                  - lambda: |-
                      id(garage_moving) = true;
                      id(garage_direction) = 1;

                  - script.execute: garage_pulse

                  - script.execute: garage_movement_watch


            # ------------------------------------------------
            # ZWISCHENSTELLUNG
            #
            # -> manueller Einzelimpuls
            #
            # Die Software gibt KEINE Richtung vor.
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return !id(garage_closed).state &&
                           !id(garage_open).state;

                then:

                  - logger.log:
                      level: INFO
                      format: "Manueller Impuls aus Zwischenstellung"

                  - script.execute: garage_pulse


  # ========================================================
  # 4. SCHLIESSEN
  # ========================================================
  #
  # Fall A:
  # Tor ist vollständig geöffnet
  # -> Impuls
  # -> Tor beginnt zu schließen
  #
  # Fall B:
  # Tor steht in Zwischenstellung
  # -> manueller Impuls
  #
  # Fall C:
  # Tor fährt bereits
  # -> KEIN weiterer Impuls
  # ========================================================

  - id: garage_close_action
    mode: single

    then:

      # ----------------------------------------------------
      # Während einer aktiven Fahrt nichts tun.
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            - logger.log:
                level: INFO
                format: "Schließen ignoriert - Garagentor fährt bereits"


      # ----------------------------------------------------
      # Wenn keine Fahrt aktiv ist:
      # ----------------------------------------------------

      - if:
          condition:
            lambda: |-
              return !id(garage_moving);

          then:

            # ------------------------------------------------
            # VOLLSTÄNDIG GEÖFFNET
            #
            # -> Schließen starten
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return id(garage_open).state;

                then:

                  - lambda: |-
                      id(garage_moving) = true;
                      id(garage_direction) = 2;

                  - script.execute: garage_pulse

                  - script.execute: garage_movement_watch


            # ------------------------------------------------
            # ZWISCHENSTELLUNG
            #
            # -> manueller Einzelimpuls
            # ------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return !id(garage_closed).state &&
                           !id(garage_open).state;

                then:

                  - logger.log:
                      level: INFO
                      format: "Manueller Impuls aus Zwischenstellung"

                  - script.execute: garage_pulse


  # ========================================================
  # 5. STOP
  # ========================================================
  #
  # STOP wird ausschließlich während einer aktiven Fahrt
  # ausgeführt.
  #
  # Der STOP besteht aus genau EINEM Relaisimpuls.
  #
  # Danach:
  # - Überwachung wird beendet
  # - garage_moving = false
  # - keine automatische Folgeaktion
  # ========================================================

  - id: garage_stop_action
    mode: single

    then:

      - if:
          condition:
            lambda: |-
              return id(garage_moving);

          then:

            # Bewegungsüberwachung abbrechen
            - script.stop: garage_movement_watch


            # Genau EIN Impuls:
            # Normstahl stoppt die aktuelle Bewegung.
            - script.execute: garage_pulse


            # Software merkt sich:
            # keine aktive Fahrt mehr.
            - lambda: |-
                id(garage_moving) = false;
                id(garage_direction) = 0;


            - logger.log:
                level: INFO
                format: "Garagentor manuell gestoppt"


# ==========================================================
# GARAGENTOR / COVER
# ==========================================================

cover:

  - platform: template
    id: garage_cover

    name: "Tor"
    device_class: garage

    has_position: true

    # Das Tor kennt drei wesentliche Positionen:
    #
    # 0.0 = geschlossen
    # 0.5 = Zwischenstellung
    # 1.0 = geöffnet

    assumed_state: true


    # ------------------------------------------------------
    # POSITION
    # ------------------------------------------------------

    lambda: |-

      // -----------------------------------------------
      // Beide Endschalter gleichzeitig aktiv
      // -----------------------------------------------
      //
      // Das kann normalerweise nicht vorkommen.
      // Daher Zwischenstellung als neutraler Zustand.

      if (id(garage_closed).state &&
          id(garage_open).state) {
        return 0.5f;
      }


      // -----------------------------------------------
      // vollständig geschlossen
      // -----------------------------------------------

      if (id(garage_closed).state) {
        return 0.0f;
      }


      // -----------------------------------------------
      // vollständig geöffnet
      // -----------------------------------------------

      if (id(garage_open).state) {
        return 1.0f;
      }


      // -----------------------------------------------
      // Zwischenstellung
      // -----------------------------------------------

      return 0.5f;


    # ------------------------------------------------------
    # ÖFFNEN
    # ------------------------------------------------------

    open_action:
      - script.execute: garage_open_action


    # ------------------------------------------------------
    # SCHLIESSEN
    # ------------------------------------------------------

    close_action:
      - script.execute: garage_close_action


    # ------------------------------------------------------
    # STOP
    # ------------------------------------------------------

    stop_action:
      - script.execute: garage_stop_action


# ==========================================================
# TEXTSTATUS
# ==========================================================
#
# Die Reihenfolge ist bewusst:
#
# 1. Fehler
# 2. aktive Fahrt
# 3. geschlossen
# 4. geöffnet
# 5. Zwischenstellung
#
# Dadurch wird während des Schließens zuverlässig
# "🟡 Schließt" angezeigt und nicht "Zwischenstellung".
# ==========================================================

text_sensor:

  # ========================================================
  # TORSTATUS
  # ========================================================

  - platform: template
    name: "Torstatus"
    icon: mdi:garage

    lambda: |-

      // -----------------------------------------------
      // Beide Endschalter gleichzeitig aktiv
      // -----------------------------------------------

      if (id(garage_closed).state &&
          id(garage_open).state) {
        return {"⚠️ Fehler"};
      }


      // -----------------------------------------------
      // AKTIVE FAHRT
      //
      // Dieser Test kommt bewusst VOR den Endlagen.
      // -----------------------------------------------

      if (id(garage_moving)) {

        if (id(garage_direction) == 1) {
          return {"🟡 Öffnet"};
        }

        if (id(garage_direction) == 2) {
          return {"🟡 Schließt"};
        }

        return {"🟡 Bewegung"};
      }


      // -----------------------------------------------
      // VOLLSTÄNDIG GESCHLOSSEN
      // -----------------------------------------------

      if (id(garage_closed).state) {
        return {"🔴 Geschlossen"};
      }


      // -----------------------------------------------
      // VOLLSTÄNDIG GEÖFFNET
      // -----------------------------------------------

      if (id(garage_open).state) {
        return {"🟢 Offen"};
      }


      // -----------------------------------------------
      // ZWISCHENSTELLUNG
      //
      // Tor steht irgendwo zwischen den Endlagen
      // und fährt momentan nicht.
      // -----------------------------------------------

      return {"🟡 Zwischenstellung"};

    update_interval: 200ms


  # ========================================================
  # WLAN / IP-INFORMATIONEN
  # ========================================================

  - platform: wifi_info

    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic

    ssid:
      name: "WLAN"
      entity_category: diagnostic


# ==========================================================
# DIAGNOSE
# ==========================================================

sensor:

  # --------------------------------------------------------
  # WLAN-Signal
  # --------------------------------------------------------

  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 60s


  # --------------------------------------------------------
  # ESP-Laufzeit
  # --------------------------------------------------------

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic


# ==========================================================
# NEUSTART
# ==========================================================

button:

  - platform: restart
    name: "ESP Neustart"
    entity_category: diagnostic